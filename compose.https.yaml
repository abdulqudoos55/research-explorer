services:
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - research_caddy_data:/data
      - research_caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  research_caddy_data:
  research_caddy_config:
